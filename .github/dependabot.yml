# Tự động mở PR cập nhật phụ thuộc mỗi tuần. Cập nhật minor/patch được gom chung 1 PR để dễ duyệt.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Ho_Chi_Minh
    labels: [dependencies, ci]
