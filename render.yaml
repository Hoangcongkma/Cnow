# Render Blueprint – bản demo Cnow (thanh toán MÔ PHỎNG, PAYMENT_MODE=demo). Hướng dẫn: README › Deploy.
# Biến có "sync: false" là bí mật: Render hỏi giá trị khi tạo Blueprint, KHÔNG lưu trong Git.
services:
  - type: web
    name: cnow
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true # git push lên nhánh đã kết nối → Render tự deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: demo
      - key: DEMO_USD_VND
        value: '26000'
      - key: DEMO_NOINDEX
        value: 'true'
      # --- Bí mật / giá trị riêng của bạn (nhập trên Render) ---
      - key: MONGODB_URI
        sync: false
      - key: BASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: MFA_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
